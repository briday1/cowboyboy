<style>
@font-face{font-family:ExamPixel;src:url("./assets/PressStart2P.ttf") format("truetype");font-display:swap}
:root{color-scheme:dark;--ink:#e9dfc4;--dim:#aaa28e;--red:#ff816e;--gold:#efbd75;--pixel:ExamPixel,ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:#080b0b;color:var(--ink);font:16px/1.45 system-ui,sans-serif;

main{max-width:1200px;margin:auto;padding:clamp(4px,1vw,12px)}
button{cursor:pointer}

button:focus-visible,a:focus-visible{outline:2px solid #f7a74a;outline-offset:3px}
[hidden]{display:none!important}
.stage{position:relative;min-height:510px;aspect-ratio:16/9;overflow:hidden;border:1px solid #454338;background:#101411;isolation:isolate}
#room{width:100%;height:100%;position:absolute;inset:0;display:block;image-rendering:pixelated}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 95px 24px #000a;background:radial-gradient(ellipse at center,transparent 35%,rgba(3,5,5,var(--dread,0)) 100%),repeating-linear-gradient(transparent 0 3px,#0002 4px 5px)}
.stage[data-lamp] .vignette{background:radial-gradient(ellipse at center,#ffd89337,transparent 65%),repeating-linear-gradient(transparent 0 3px,#0002 4px 5px)}
.stage.hit .vignette{background:#9a271b65}
.hud,.utility,.controls,.look,.cue{position:absolute;color:var(--ink);font:9px/1.65 var(--pixel);text-transform:uppercase}
.hud,.controls,.look{z-index:2}
.hud,.utility{display:flex;gap:4px}
.hud{align-items:center;top:12px;left:12px;flex-wrap:wrap;max-width:calc(100% - 200px)}
.hud > span{padding:5px 7px;background:#0e1410e6;border-bottom:2px solid #544a34}
.hud .clock{font-size:12px;color:var(--gold)}
.hud .danger,.hud .clock.low{color:var(--red)}
.hud .bean{color:#ffdf9a;background:#4e3419f2;border:1px solid #e4ae5d;border-bottom-width:2px}
.hud .bean[data-state="shield"]{color:#e2f5c2;background:#2e4221f2;border-color:#9fbc70}
.hud .bean[data-state="blocked"]{color:#fff1ba;background:#573e23f2}
#bean-timer{color:#fff3cb}
.controls button[data-beans]{background:#5b3a1b;color:#fff1b7;border-color:#f1b65c;box-shadow:0 0 0 1px #b9782c}
#act[data-beans]{background:#e6b969;color:#28190c;border-color:#fff0b5}
.utility{z-index:4;top:12px;right:12px}
.stage:not(.in-exam) .hud,.stage:not(.in-exam) .controls,.stage:not(.in-exam) #pause{display:none}
.look{right:12px;top:47px;padding:3px 6px;background:#0e1410d9;color:#cbc2a8;font-size:8px;text-align:right;pointer-events:none}
.cue{z-index:2;top:70px;left:50%;transform:translateX(-50%);margin:0;width:max-content;max-width:calc(100% - 24px);
  padding:5px 8px;text-align:center;background:#0e1410ef;color:#ffb18c;pointer-events:none}
.cue:empty{display:none}
.controls{display:flex;gap:5px;bottom:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px)}
.controls button,.utility button{font:inherit;text-transform:inherit;border:1px solid #817253;border-bottom:2px solid #534732;border-radius:0;
  background:#111812ed;color:#e8d9b2;padding:6px 9px;min-height:32px;white-space:nowrap}
.controls button[aria-pressed=true],.utility button[aria-pressed=true]{background:#332b1c;color:#ffd58b;border-color:#b28d54}
.controls button:not(:disabled):hover,.utility button:not(:disabled):hover{background:#4e3a25;color:#ffe4b2}
.controls button:disabled{opacity:.5}
#act{position:absolute;right:0;bottom:40px;touch-action:none;background:#4c3421;color:#ffe5b7;border-color:#d4a46c}
#act:disabled{visibility:hidden}
.bean-pickup{position:absolute;transform:translate(-50%,-50%);min-width:48px;min-height:48px;
  border:2px solid #ffe7a033;border-radius:0;background:transparent;padding:0;touch-action:manipulation}
.bean-pickup:hover,.bean-pickup:focus-visible{border-color:#ffe7a0;background:#ffc95a18}
.trial{position:absolute;z-index:2;left:50%;top:72px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 18px);
  text-align:center;color:#f0deb8;font:9px/1.65 var(--pixel);pointer-events:none;text-shadow:2px 2px #080c0a}
.trial-head{display:flex;justify-content:center;align-items:center;gap:8px;color:#f2bf78;text-transform:uppercase}
.trial-head strong,.trial-head span{padding:4px 6px;background:#111813ef;border-bottom:2px solid #735939}
.trial p{margin:5px 0}
.trial-score{color:#ccc095;font-size:8px}
.trial-object{position:absolute;z-index:2;transform:translate(-50%,-50%);display:grid;place-items:center;width:49px;height:49px;
  background:#251e130c;color:#ffedc1;border:1px solid #a98d5a8c;padding:0;border-radius:0;touch-action:none;
  font:9px/1 var(--pixel);text-shadow:1px 2px #1b1a11;box-shadow:inset 0 0 0 2px #211d1473}
.trial-object[data-wide]{width:75px}
.trial-object:hover,.trial-object:focus-visible{border-color:#ffe5a3;background:#f4c47725}
.trial-object[data-lit]{color:#fff6d1;border-color:#ffcf84;box-shadow:0 0 0 2px #ab713d,inset 0 0 0 2px #edbb6b45}
.trial-object[data-held]{border-color:#b6cc9a;background:#33524054}
.trial-object[data-demo]{pointer-events:none;opacity:.66}
.trial-object[data-blocked]{border-color:#b75f57;background:#522a2b55}
.trial-object[data-fastened]{border-color:#71846b;color:#b6c59a;opacity:.75}
.ending-caption{position:absolute;z-index:2;bottom:30px;left:50%;transform:translateX(-50%);width:max-content;
  max-width:calc(100% - 20px);margin:0;padding:8px 11px;text-align:center;background:#0b1010e8;color:#f1ddaf;font:10px/1.7 var(--pixel)}
.ending-caption strong{color:#f2ad6c}
.stage.end-black .overlay{background:#030405}
.stage.end-black .panel{background:none;border:0;box-shadow:none;text-align:center}
.stage.end-black .utility{display:none}
.overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;overflow:auto;padding:54px 18px 24px;
  background:#080d0deb;font:9px/1.9 var(--pixel)}
.panel{max-width:560px;width:100%;padding:clamp(16px,4vw,28px);background:#151e1a;color:#eadab6;
  border:2px solid #917957;box-shadow:inset 0 0 0 4px #101512,inset 0 0 0 6px #514b38,7px 7px 0 #040606;
  clip-path:polygon(0 7px,7px 7px,7px 0,calc(100% - 7px) 0,calc(100% - 7px) 7px,100% 7px,

.panel .eyebrow{font:8px/1.7 var(--pixel);letter-spacing:.065em;color:#cfac75;text-transform:uppercase}
.panel h1{font:clamp(18px,3.6vw,30px)/1.45 var(--pixel);margin:9px 0 13px;text-transform:uppercase;color:#f4e3be}
.panel p{margin:8px 0 12px}
.panel ul{margin:10px 0 14px;padding-left:20px}
.panel li{margin-bottom:9px}
.panel button{display:block;width:max-content;max-width:100%;min-height:40px;margin-top:7px;padding:8px 12px;
  border:2px solid #a4865c;border-radius:0;background:#212820;color:#edd9ad;font:9px/1.5 var(--pixel);text-transform:uppercase}
.panel .primary{background:#e4b573;color:#211909;border-color:#f0d29a;box-shadow:inset 0 -3px #a77745}
.panel button:hover,.panel button:focus-visible{background:#f0ce91;color:#20170d}
.panel a{color:#f2ca91}
.review{max-height:152px;overflow:auto;padding-right:7px;font:12px/1.45 ui-monospace,monospace}
.overlay[data-screen="title"]{place-items:center stretch;padding:clamp(38px,6vw,82px);
  background:linear-gradient(90deg,#0a1014 0%,#0a1014ed 28%,#0a101440 55%,transparent 76%)}
.overlay[data-screen="title"] .panel{max-width:640px;width:100%;padding:0;border:0;box-shadow:none;background:none;clip-path:none}
.title-screen{width:max-content;max-width:100%}
.title-screen .title-index{margin:0 0 17px;color:#b7b8a0;font:9px/1.6 var(--pixel);letter-spacing:.1em;text-transform:uppercase}

.title-screen .subtitle{margin:13px 0 25px;color:#eca767;font:clamp(10px,1.8vw,19px)/1.5 var(--pixel);letter-spacing:.1em;text-transform:uppercase}

.title-actions button{width:100%;margin:0;display:flex;justify-content:space-between;align-items:center;text-align:left}

.stage.end-black .panel button{margin:12px auto 0}
@media(max-width:600px){
  .overlay{padding:48px 12px 15px;font-size:8px}

  .title-screen .subtitle{font-size:10px;margin:9px 0 0}
  .title-actions{margin-top:auto}
  .title-screen .title-note{margin-top:9px}
}

  .stage{min-height:min(540px,calc(100svh - 8px))}

  .hud .clock{font-size:9px}

  .trial-score{font-size:7px}

.paper{position:absolute;top:0;left:0;transform-origin:0 0;box-sizing:border-box;width:540px;height:464px;
  display:flex;flex-direction:column;padding:28px 28px 22px;color:#342818;
  background:repeating-linear-gradient(0deg,#9a71351a 0 1px,transparent 1px 25px),#deca98;
  border:2px solid #ae915f;box-shadow:inset 0 0 0 3px #cbb17a;
  color-scheme:light;font:10px/1.65 ExamPixel,ui-monospace,monospace}
.paper[inert]{pointer-events:none}
.paper .eyebrow{font-size:10px;color:#793f2d;letter-spacing:0}
.paper h2{font:14px/1.6 ExamPixel,ui-monospace,monospace;margin:11px 0 8px}
.paper-body{flex:1;display:grid;align-items:center}
.plate{width:100%;max-width:440px;margin:auto;position:relative;background:#eee0b429}
.plate svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.plate .ink{fill:#b9a179;stroke:#614b34;stroke-width:2}
.plate .bone{fill:#a68b63;stroke:#634e37;stroke-width:2}
.plate .mane{fill:#71533a;stroke:#5e442f;stroke-width:1.4}
.plate .coat-light{fill:#c9b487}
.plate .detail{fill:none;stroke:#806649;stroke-width:1.5}
.plate .tube{fill:none;stroke-width:7;stroke-linecap:round}
.plate text{fill:#70583a;text-anchor:middle;font:9px ui-monospace,monospace;letter-spacing:2px}
.paper button{font:inherit;border:0;border-radius:0;background:none;color:inherit}
.paper button:focus-visible{outline:2px dashed #874b33;outline-offset:1px}
.paper button:disabled{opacity:.48}
.paper button:not(:disabled):hover,.paper button[aria-pressed=true]{color:#7f301e;background:#b4693c25}
.paper .pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;padding:0;
  border:2px solid #884626;background:#f3dba8;color:#633520;text-align:center;font-size:13px}
.paper .pin[aria-pressed=true]{background:#315837;color:#f4f5ce;border-color:#214227}
.paper button[aria-pressed=true]::after{content:'✓';font:700 18px/1 system-ui,sans-serif}
.paper .pin[aria-pressed=true]::after{position:absolute;top:-9px;right:-9px;color:#f4f5ce;background:#315837;padding:1px 2px}
.answers{display:grid;gap:4px}
.paper .answers button{min-height:40px;padding:7px 10px;text-align:left;font-size:13px;border-bottom:1px dashed #a18153}
.paper .answers button[aria-pressed=true]{position:relative;padding-right:32px;background:#b8cc91;color:#23462b;box-shadow:inset 3px 0 #426841}
.paper .answers button[aria-pressed=true]::after{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.paper button[aria-pressed=true]{opacity:1}
.paper button[data-wrong]{color:#872e24;text-decoration:line-through;text-decoration-thickness:2px;opacity:1}
.paper .status[data-result="correct"]{color:#294c31;font-size:12px;text-transform:uppercase}
.paper .status[data-result="correct"]::before{content:'✓ ';font:700 16px/1 system-ui,sans-serif}
.paper #next:not(:disabled),.paper #submit:not(:disabled){background:#315837;color:#fcf5d2;padding:8px 10px;border-bottom:2px solid #233d28}
.paper #next:not(:disabled):hover,.paper #submit:not(:disabled):hover{background:#23492c}
.paper .status[data-result="incorrect"]{color:#872e24}
.paper-wait{text-align:center;line-height:1.8;color:#694a31}
.paper-wait strong{display:block;margin:8px 0;font-size:24px;color:#793f2d}
.paper-foot{display:flex;align-items:center;gap:4px;min-height:36px;border-top:2px solid #a48454}
.paper-foot button{padding:8px 5px;white-space:nowrap}
.paper-foot .status{flex:1;text-align:center;font-size:9px;color:#694a31}
.paper progress{appearance:none;border:0;width:100%;height:5px;background:#b79b69}

.paper progress::-webkit-progress-value{background:#823c2a}
.paper progress::-moz-progress-bar{background:#823c2a}

function frame(now) {
  const dt = Math.min(.1,Math.max(0,(now - lastFrame) / 1000));
  lastFrame = now;
  if (run.mode === 'running' || run.mode === 'ending') {
    const target = views[run.view], blend = 1 - Math.exp(-dt * 6.8);
    camera.yaw += (target.yaw - camera.yaw) * blend;
    camera.pitch += (target.pitch - camera.pitch) * blend;
    camera.y += ((target.y ?? 0) - camera.y) * blend;
    camera.z += ((target.z ?? 0) - camera.z) * blend;
    camera.lean += ((run.view === 'desk' ? 1 : 0) - camera.lean) * blend;
    if (run.mode === 'ending') endingTick(dt);
    else {
      tick(dt);
      renderUI();
    }
  }
  const readingFocal = Math.min(148,canvas.width * .65);
  focal = 178 + (readingFocal - 178) * camera.lean;
  if (run.mode === 'intro') drawSplash();
  else room();
  placeExamSheet();
  requestAnimationFrame(frame);
}
for (const type of ['selectstart','dragstart']) {
  $('stage').addEventListener(type,event => event.preventDefault());
}
const bindings = {ArrowLeft:'left',KeyA:'left',ArrowUp:'front',KeyW:'front',ArrowRight:'right',KeyD:'right',ArrowDown:'desk',KeyS:'desk'};
for (const button of viewButtons) button.onclick = () => { if (!run.trial) go(button.dataset.view); };
trialButtons.forEach((button,i) => {
  button.addEventListener('click',() => { if (run.trial?.spec.id !== 'breath') trialInput(i); });
  button.addEventListener('pointerdown',event => {
    if (run.trial?.spec.id !== 'breath') return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    trialInput(i);
  });
  for (const event of ['pointerup','pointercancel','lostpointercapture']) {
    button.addEventListener(event,() => { if (run.trial) run.trial.holding = false; });
  }
});
$('sound').onclick = () => {
  muted = !muted && (!audioRequested || Boolean(soundPlaying()));
  $('professor-voice').muted = muted;
  audioInit(run.mode !== 'ending');
};
$('pause').onclick = pause;
$('bean-pickup').onclick = collectBeans;
$('prev').onclick = () => changePage(-1);
$('next').onclick = () => changePage(1);
$('submit').onclick = () => {
  if (run.mode === 'running' && run.view === 'desk' && focused() && !run.pending && answerCount() === exam.length) finish('submit');
};
$('act').addEventListener('pointerdown',event => {
  event.preventDefault();
  $('act').setPointerCapture(event.pointerId);
  interact();
});
for (const name of ['pointerup','pointercancel','lostpointercapture']) {
  $('act').addEventListener(name,() => { pressed = false; });
}
window.addEventListener('keydown',event => {
  if (event.code === 'Escape') {
    if (!event.repeat) {
      if (run.mode === 'intro' && $('overlay').dataset.screen === 'help') intro();
      else pause();
    }
    return;
  }
  if (run.mode !== 'running' || event.metaKey || event.ctrlKey || event.altKey) return;
  if (run.trial) {
    const id = run.trial.spec.id;
    const index = event.code === 'Space' && (id === 'breath' || id === 'bell') ? 0 :
      /^Digit[1-6]$/.test(event.code) ? Number(event.code.slice(-1)) - 1 : -1;
    if (index >= 0 && index < run.trial.spec.buttons.length) {
      event.preventDefault();
      if (!event.repeat) trialInput(index);
    }
    return;
  }
  if (bindings[event.code]) {
    event.preventDefault();
    go(bindings[event.code]);
  } else if (event.code === 'KeyE') {
    event.preventDefault();
    if (!event.repeat) interact();
  } else if (/^Digit[1-4]$/.test(event.code)) {
    choose(Number(event.code.slice(-1)) - 1);
  } else if (event.code === 'BracketLeft' || event.code === 'BracketRight') {
    changePage(event.code === 'BracketLeft' ? -1 : 1);
  }
});
$('act').addEventListener('click',event => {
  if (!event.detail) interact();
});
$('act').addEventListener('keydown',event => {
  if (event.code !== 'Space' && event.code !== 'Enter') return;
  event.preventDefault();
  if (!event.repeat) interact();
});
$('act').addEventListener('keyup',event => {
  if (event.code === 'Space' || event.code === 'Enter') pressed = false;
});
window.addEventListener('keyup',event => {
  if (event.code === 'KeyE') pressed = false;
  if (run.trial && (event.code === 'Space' || event.code === 'Digit1')) run.trial.holding = false;
});
window.addEventListener('blur',() => {
  pressed = false;
  if (run.trial) run.trial.holding = false;
});
document.addEventListener('visibilitychange',() => {
  if (document.hidden && run.mode === 'running') pause();
});
intro();
requestAnimationFrame(frame);
