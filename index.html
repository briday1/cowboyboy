function frame(now) {

    camera.pitch += (target.pitch - camera.pitch) * blend;
    camera.y += ((target.y ?? 0) - camera.y) * blend;
    camera.z += ((target.z ?? 0) - camera.z) * blend;
    camera.lean += ((run.view === 'desk' ? 1 : 0) - camera.lean) * blend;
    tick(dt);
    renderUI();
  }
  const readingFocal = Math.min(148,canvas.width * .65);
  focal = 178 + (readingFocal - 178) * camera.lean;
