<body>
<main>
<header><strong>COWBOYBOY / HORSE UNIVERSITY</strong><div class="utility"><button id="sound" aria-pressed="true">Sound on</button><button id="pause" disabled>Pause</button></div></header>
<div class="hud"><span>FINAL EXAM</span><span id="progress">0 / 18 answered</span><span id="nerve">Composure 3 / 3</span><span class="clock" id="clock">12:00</span></div>
<div class="stage" id="stage">
<canvas id="room" width="384" height="216" aria-label="First-person view from the exam desk"></canvas><div class="vignette"></div>
<div class="look" id="look"></div>

<div class="eyebrow" id="sheet"></div><h2 id="question"></h2><div class="answers" id="answers"></div>

<progress id="writing" max="1" value="0" aria-label="Writing progress"></progress>
</section>
<p class="cue" id="cue" role="status"></p>
<div class="overlay" id="overlay"><section class="panel" id="panel"></section></div>
</div>
<nav class="controls" aria-label="Look controls">
<button data-view="left" disabled>← Window</button><button data-view="front" disabled>↑ Hall</button><button data-view="right" disabled>→ Seam</button><button data-view="desk" disabled>↓ Exam</button><button id="act" disabled>E · Interact</button>

<p class="hint">Arrows or tap to look. 1–4 to choose an answer. E to interact. Esc to pause.</p>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const exam = [
  ['Where on a horse is the poll?', ['Between and just behind the ears','Above the tail','At the shoulder','Under the jaw'],0,'The poll is at the top of the head, just behind the ears.'],
  ['What is the ridge where the neck meets the back?', ['Croup','Withers','Loin','Barrel'],1,'The withers are the ridge above the shoulders.'],
  ['Which region includes the rib cage?', ['Crest','Pastern','Barrel','Dock'],2,'The barrel is the rounded middle around the ribs.'],
  ['Which part is the upper surface of the hindquarters?', ['Poll','Flank','Gaskin','Croup'],3,'The croup lies between the loin and the tail.'],
  ['What is the anatomical name for the horse’s front knee?', ['Tarsus','Carpus','Stifle','Fetlock'],1,'The carpus is the joint commonly called the knee on a foreleg.'],
  ['What is the common name for the tarsus?', ['Hock','Knee','Elbow','Stifle'],0,'The hock is the tarsal joint region on the hind limb.'],
  ['Where is the fetlock relative to the pastern?', ['Behind the hock','Inside the hoof','Immediately above it','Immediately below it'],2,'The fetlock is the joint immediately above the pastern region.'],
  ['Which region lies between the fetlock and the hoof?', ['Cannon','Pastern','Gaskin','Forearm'],1,'The pastern spans the region between the fetlock and hoof.'],
  ['Which hind-limb joint is highest on this list?', ['Hock','Fetlock','Pastern joint','Stifle'],3,'The stifle sits above the hock on the hind limb.'],
  ['What is the muscular region between the stifle and hock called?', ['Gaskin','Cannon','Coronet','Forearm'],0,'The gaskin is the lower thigh, above the hock.'],
  ['What marks the border at the top of the hoof wall?', ['Ergot','Coronary band','Chestnut','Knee'],1,'The coronary band lies where the skin meets the top of the hoof wall.'],
  ['Which part is the bony base of the tail?', ['Muzzle','Loin','Dock','Crest'],2,'The dock is the solid upper part of the tail.'],
  ['Which tube carries swallowed feed to the stomach?', ['Trachea','Cecum','Colon','Esophagus'],3,'The esophagus connects the throat to the stomach.'],
  ['Where does feed go directly after the stomach?', ['Small intestine','Large colon','Cecum','Esophagus'],0,'The stomach empties into the small intestine.'],
  ['Where does much enzymatic digestion and nutrient absorption occur?', ['Mouth','Small intestine','Cecum','Rectum'],1,'The small intestine is a major site of enzymatic digestion and nutrient uptake.'],
  ['Which blind-ended chamber receives digesta from the small intestine?', ['Stomach','Esophagus','Cecum','Rectum'],2,'The cecum receives digesta from the small intestine and houses fiber-fermenting microbes.'],
  ['Which section follows the cecum along the main path of digesta?', ['Small intestine','Esophagus','Stomach','Large colon'],3,'Digesta passes from the cecum to the large colon.'],
  ['Which two regions are major sites of microbial fiber fermentation?', ['Stomach and esophagus','Cecum and large colon','Mouth and stomach','Esophagus and small intestine'],1,'Microbes in the cecum and large colon break down much of the fiber a horse eats.']

const sheets = ['External landmarks','Hindquarters and joints','Lower limb','Conformation','Digestive tract','The hindgut'];
const releases = [0, 80, 178, 281, 391, 510];
const examTime = 720;
const writingTime = 2.3;
const views = {
  desk:{yaw:0,pitch:-.66,label:'Exam paper'},
  left:{yaw:-.77,pitch:0,label:'Left · Window'},
  front:{yaw:0,pitch:0,label:'Ahead · Hall'},
  right:{yaw:.77,pitch:0,label:'Right · Wall seam'}

const threats = [
  {view:'left',name:'The Knocker',cue:'LEFT · Something scratches the window.',action:'Flash the lamp',time:.85,pan:-.85,freq:560,loss:'The Knocker reached through the glass.'},
  {view:'front',name:'The Hall Monitor',cue:'AHEAD · Hoofbeats in the hall.',action:'Keep looking at it',time:1.5,pan:0,freq:80,loss:'The Hall Monitor stepped inside.'},
  {view:'right',name:'The Seam',cue:'RIGHT · A whisper from the wall.',action:'Hold the latch',time:1.45,pan:.85,freq:240,loss:'The seam opened behind your shoulder.'}
];
const hud = {clock:$('clock'),progress:$('progress'),nerve:$('nerve')};
const viewButtons = [...document.querySelectorAll('[data-view]')];
const canvas = $('room'), ctx = canvas.getContext('2d');
const camera = {yaw:0,pitch:0};
const run = {mode:'intro',view:'front',remaining:examTime,health:3};
let audio, master, hum, muted = false, pressed = false, lastFrame = performance.now();
let lastPaper = '', lastCue = '', lastView = '';
function audioInit() {

    master.connect(audio.destination);
    hum = audio.createGain();
    hum.gain.value = .32;
    hum.connect(master);

}
function soundLevel() {

  hum.gain.setTargetAtTime(run.mode === 'running' ? 1 : .2,audio.currentTime,.2);

function note(hz, seconds, level, pan = 0, type = 'triangle', slide = hz, delay = 0) {

  gain.gain.exponentialRampToValueAtTime(level,start + .018);
  gain.gain.exponentialRampToValueAtTime(.001,start + seconds);
  osc.connect(gain);
  if (audio.createStereoPanner) {
    const stereo = audio.createStereoPanner();
    stereo.pan.value = pan;
    gain.connect(stereo).connect(master);

  osc.stop(start + seconds + .02);

function warning(threat) {

  if (view === 'left') {
    for (let i = 0; i < 5; i++) note(freq + i * 85,.17,.12,pan,'sawtooth',105,i * .097);
  } else if (view === 'front') {
    for (let i = 0; i < 3; i++) note(freq,.27,.27,pan,'triangle',28,i * .24);
  } else {
    note(freq,.92,.14,pan,'sawtooth',55);
    note(freq * 1.08,.81,.09,pan,'triangle',137,.12);
  }

function start() {
  Object.assign(run,{mode:'running',view:'front',remaining:examTime,elapsed:0,health:3,page:0,answers:Array(exam.length).fill(null),pending:null,threat:null,nextThreat:13,previousThreat:-1,wave:0,notice:'',noticeUntil:0,hitUntil:0});
  camera.yaw = 0;
  camera.pitch = 0;
  lastPaper = '';
  pressed = false;
  audioInit();
  $('overlay').hidden = true;
  renderUI();
}
function go(view) {
  if (run.mode !== 'running' || run.view === view) return;
  run.view = view;
  if (run.pending) {
    run.pending = null;
    run.notice = 'You lifted the pencil. That answer was interrupted.';
    run.noticeUntil = run.elapsed + 2;
  }
  pressed = false;
  note(105,.15,.045,0,'triangle',52);
  renderUI();
}
function focused() {
  const target = views[run.view];
  return Math.abs(camera.yaw - target.yaw) < .022 && Math.abs(camera.pitch - target.pitch) < .022;
}
function unlocked() {
  return Math.max(0,releases.findLastIndex(t => run.elapsed >= t));
}
function changePage(delta) {
  if (run.mode !== 'running' || run.view !== 'desk' || !focused() || run.pending) return;
  const next = run.page + delta;
  if (next >= 0 && next < (unlocked() + 1) * 3) run.page = next;
  renderUI();
}
function choose(option) {
  if (run.mode !== 'running' || run.view !== 'desk' || !focused() || run.pending) return;
  if (run.answers[run.page] === option) return;
  run.pending = {page:run.page,option,progress:0};
  note(780,.34,.025,.08,'sawtooth',240);
  renderUI();
}
function spawn() {
  let index = Math.floor(Math.random() * threats.length);
  if (index === run.previousThreat) index = (index + 1 + Math.floor(Math.random() * 2)) % threats.length;
  run.previousThreat = index;
  run.wave++;
  run.threat = {kind:threats[index],progress:0,age:0,limit:Math.max(5.2,10.4 - run.elapsed * .009),nextWarn:2.45};
  warning(run.threat.kind);
}
function resolveThreat(survived) {
  const {kind} = run.threat;
  run.threat = null;
  pressed = false;
  run.noticeUntil = run.elapsed + 2.25;
  run.nextThreat = run.elapsed + Math.max(7.7,20 - run.elapsed * .018) + 5 * Math.random();
  if (survived) {
    run.notice = kind.name + ' backed off.';
    note(195,.31,.11,kind.pan,'triangle',60);
    return;
  }
  run.health--;
  run.hitUntil = run.elapsed + .25;
  run.notice = kind.loss;
  note(60,.75,.34,kind.pan,'sawtooth',21);
  if (!run.health) finish('caught');
}
function tick(dt) {
  run.elapsed += dt;
  run.remaining = Math.max(0,examTime - run.elapsed);
  if (!run.remaining) { finish('time'); return; }
  if (run.pending) {
    const item = run.pending;
    item.progress += dt;
    if (item.progress >= writingTime) {
      run.answers[item.page] = item.option;
      run.pending = null;
      note(405,.14,.064,.1,'triangle',240);
    }
  }
  if (!run.threat && run.elapsed >= run.nextThreat) spawn();
  const threat = run.threat;
  if (!threat) return;
  threat.age += dt;
  if (threat.age >= threat.limit) { resolveThreat(false); return; }
  if (threat.age >= threat.nextWarn) {
    threat.nextWarn += 2.05;
    warning(threat.kind);
  }
  const looking = focused() && run.view === threat.kind.view;
  const defending = looking && (threat.kind.view === 'front' || pressed);
  threat.progress = defending ? threat.progress + dt : Math.max(0,threat.progress - dt * 2);
  if (threat.progress >= threat.kind.time) resolveThreat(true);

function timeText(t) {
  const whole = Math.ceil(t);
  return String(Math.floor(whole / 60)).padStart(2,'0') + ':' + String(whole % 60).padStart(2,'0');
}
function answerCount() { return run.answers ? run.answers.filter(value => value !== null).length : 0; }
function setCue(text) {
  if (lastCue !== text) { $('cue').textContent = text; lastCue = text; }
}
function paperUI() {
  const available = (unlocked() + 1) * 3, page = run.page;
  const key = [page,run.answers[page],available,Boolean(run.pending),answerCount()].join('/');

    lastPaper = key;
    $('sheet').textContent = `Sheet ${Math.floor(page / 3) + 1} / 6 · ${sheets[Math.floor(page / 3)]} · Question ${page + 1}`;
    $('question').textContent = exam[page][0];
    $('answers').replaceChildren(...exam[page][1].map((answer,i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `${i + 1}. ${answer}`;
      button.disabled = Boolean(run.pending);
      button.setAttribute('aria-pressed',String(run.answers[page] === i));
      button.onclick = () => choose(i);
      return button;
    }));
    $('prev').disabled = page === 0 || Boolean(run.pending);
    $('next').disabled = page + 1 >= available || Boolean(run.pending);

    $('submit').disabled = Boolean(run.pending);
  }
  $('writing').value = run.pending ? run.pending.progress / writingTime : run.answers[page] !== null ? 1 : 0;

  if (page + 1 >= available && available < exam.length && run.answers[page] !== null) {
    status = `Next sheet in ${timeText(releases[unlocked() + 1] - run.elapsed)}`;

  if ($('paper-status').textContent !== status) $('paper-status').textContent = status;

function renderUI() {
  const playing = run.mode === 'running', settled = focused(), threat = run.threat;
  const desk = playing && settled && run.view === 'desk';
  $('paper').hidden = !desk;
  if (desk) paperUI();
  hud.clock.textContent = timeText(run.remaining);
  hud.clock.classList.toggle('low',run.remaining <= 60);
  hud.progress.textContent = `${answerCount()} / ${exam.length} answered`;
  hud.nerve.textContent = `Composure ${run.health} / 3`;
  hud.nerve.classList.toggle('danger',run.health <= 1);
  $('pause').disabled = !playing && run.mode !== 'paused';
  $('pause').textContent = run.mode === 'paused' ? 'Resume' : 'Pause';

  for (const button of viewButtons) {

  const engaged = playing && settled && threat && threat.kind.view === run.view;

    const progress = threat.progress / threat.kind.time;
    const bars = progress > 0 ? ' ' + '■'.repeat(Math.floor(progress * 5)) + '□'.repeat(5 - Math.floor(progress * 5)) : '';

function showPanel(html) {

  renderUI();

}
function intro() {
  showPanel(`<div class="eyebrow">ROOM 13 · AFTER HOURS</div><h1>The Night Final</h1>
  <p>You have twelve minutes to pass horse anatomy. Someone has already taken attendance.</p>
  <ul><li>Look down to write. Keep your eyes on the page until the pencil stops. Six sheets arrive during the exam.</li><li>Scratching on the left: look at the window and hold E to flash the lamp. Hoofbeats ahead: stare into the hall. Whispering on the right: look at the seam and hold E to latch it.</li><li>The clock keeps running as you turn. Three hits end the exam. Fill all 18 answers and get at least 14 right.</li></ul>

function pause() {
  if (run.mode === 'running') {

  }

function finish(reason) {

  const result = reason === 'caught' ? 'Something got in.' : reason === 'time' ? 'Time’s up.' : passed ? 'You passed.' : 'You failed the final.';

  ${passed ? '<p>The proctor signs your diploma. His hoof leaves no ink.</p>' : '<p>Pass mark: 14 correct and all 18 answers turned in.</p>'}

function point(x,y,z) { return [x,y,z]; }
function cameraPoint([x,y,z]) {

function project([x,y,z]) { return [192 + x * 178 / z,108 - y * 178 / z]; }
function clip(points) {
