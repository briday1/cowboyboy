function frame(now) {
  const dt = Math.min(.1,Math.max(0,(now - lastFrame) / 1000));
  lastFrame = now;

    const target = views[run.view], blend = 1 - Math.exp(-dt * 6.8);
    camera.yaw += (target.yaw - camera.yaw) * blend;
    camera.pitch += (target.pitch - camera.pitch) * blend;
    tick(dt);
    renderUI();
  }
  room();
  requestAnimationFrame(frame);
}
